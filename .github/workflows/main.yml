name: Build TWRP Recovery (Max Space Enabled)

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Free Disk Space (Aggressive Cleanup)
      run: |
      
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        
        
        sudo apt-get clean
        sudo apt-get autoremove -y
        
  

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y g++-multilib gcc-multilib lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev git python3

    - name: Install Google Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize Repo and Sync Source
      run: |
        mkdir twrp && cd twrp
        repo init --depth=1 -u https://github.com -b twrp-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com device/infinix/X6840

    - name: Build Recovery Image
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        . build/envsetup.sh
        lunch twrp_X6840-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload TWRP Artifact
      uses: actions/upload-artifact@v3
      with:
        name: TWRP-Infinix-X6840-Build
        path: twrp/out/target/product/X6840/recovery.img
        
